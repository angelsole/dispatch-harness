name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    # Runs on Linux to prove the gate (and the shipped scripts) are portable
    # off macOS, where the harness normally runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Everything else the suites need (jq, git, script(1)) is preinstalled on
      # ubuntu-latest.
      - name: Run gate (lint + tests/*.test.sh)
        run: bash gate.sh

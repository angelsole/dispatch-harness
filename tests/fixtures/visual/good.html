<!doctype html>
<meta charset="utf-8">
<title>visual gate fixture — good</title>
<!--
  A render the gate must PASS, built to be exactly what the checks measure:

    * 16 colours and no others. Every block below is one of the palette
      entries tests/visual-gate.test.sh writes into palette.png, so
      offpalette_pct comes out at 0. No text, no gradients, no shadows, no
      border radius: each of those is an anti-aliased edge, and an
      anti-aliased edge is a colour that is not in the palette.
    * Everything on a 16 px grid, at 640x360 with dpr 1.
    * A luminance floor. The background is #14182c, not #000 — dark enough to
      read as night, light enough that pure_black_pct is 0.
    * Static. No animation and no script, so consecutive frames are identical
      and continuity RMSE is 0.

  Its counterpart is bad.html, which breaks the last three on purpose.
-->
<style>
  html, body { margin: 0; padding: 0; background: #14182c; }
  body { width: 640px; height: 360px; overflow: hidden; }
  i { position: absolute; display: block; }
</style>
